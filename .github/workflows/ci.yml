name: Goodwin Grow CRM CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build, Lint & Multi-Tenant Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_test_password
          POSTGRES_DB: goodwin_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Push Prisma Schema
        env:
          DATABASE_URL: postgresql://crm_user:crm_test_password@localhost:5432/goodwin_crm_test?schema=public
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed Demo Multi-Tenant Data
        env:
          DATABASE_URL: postgresql://crm_user:crm_test_password@localhost:5432/goodwin_crm_test?schema=public
        run: npm run db:seed

      - name: Run Vitest Security & Tenant Isolation Suite
        env:
          DATABASE_URL: postgresql://crm_user:crm_test_password@localhost:5432/goodwin_crm_test?schema=public
        run: npm run test

      - name: Verify Production Next.js Build
        env:
          DATABASE_URL: postgresql://crm_user:crm_test_password@localhost:5432/goodwin_crm_test?schema=public
          SESSION_SECRET: test_ci_session_secret_2026_goodwin_grow_ai
        run: npm run build
