services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goodwin_crm_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://crm_user:crm_secure_password@postgres:5432/goodwin_crm?schema=public
      - SESSION_SECRET=goodwin_grow_crm_docker_production_session_secret_2026!
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: goodwin_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_secure_password
      POSTGRES_DB: goodwin_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d goodwin_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
